<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Netrunner — Revised Core</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Dark cyberpunk theme — Phase 5 checkpoint styling. */
:root {
  --bg: #0b0e14;
  --bg2: #12161f;
  --panel: #161b26;
  --edge: #2a3242;
  --text: #c9d4e3;
  --dim: #7a8699;
  --accent: #35e0c8;      /* neon teal */
  --accent2: #ff4d9d;     /* neon magenta */
  --gold: #ffd23f;
  --danger: #ff5c5c;
  --good: #6ee06e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: radial-gradient(1200px 600px at 70% -10%, #17243a 0%, var(--bg) 55%);
  color: var(--text);
  font: 14px/1.4 "SF Mono", ui-monospace, Menlo, Consolas, monospace;
}
button, select, input { font: inherit; }

/* ---------- setup screen ---------- */
.setup { max-width: 720px; margin: 6vh auto; padding: 0 24px; }
.setup h1 {
  font-size: 44px; letter-spacing: 0.35em; margin: 0;
  color: var(--accent); text-shadow: 0 0 18px rgba(53,224,200,.45);
}
.setup-sub { color: var(--dim); margin-bottom: 28px; letter-spacing: .15em; }
.setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
.setup-block {
  border: 1px solid var(--edge); border-radius: 6px; background: var(--panel);
  padding: 8px 14px 12px; margin: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
}
.setup-wide { grid-column: 1 / -1; }
.setup-block legend { color: var(--accent); padding: 0 6px; font-size: 12px; letter-spacing: .1em; }
.radio-row { display: flex; gap: 26px; align-items: center; padding: 4px 2px; }
.radio-row label { cursor: pointer; white-space: nowrap; }
.setup-block select, .setup-block input {
  width: 100%; height: 34px; background: var(--bg2); color: var(--text);
  border: 1px solid var(--edge); border-radius: 4px; padding: 6px 8px;
}
.deck-desc { color: var(--dim); font-size: 13px; margin: 14px 2px; }
.deck-desc b { color: var(--text); }

/* ---------- buttons ---------- */
.btn {
  background: var(--bg2); color: var(--text);
  border: 1px solid var(--edge); border-radius: 4px;
  padding: 6px 12px; cursor: pointer; text-align: left;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary {
  border-color: var(--accent); color: var(--accent);
  box-shadow: 0 0 12px rgba(53,224,200,.25) inset;
}
.btn-big { font-size: 18px; padding: 10px 34px; margin-top: 10px; letter-spacing: .2em; }

/* ---------- table layout ---------- */
.layout { display: flex; height: 100vh; }
.board { flex: 1; overflow: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
.sidebar {
  width: 340px; min-width: 340px; border-left: 1px solid var(--edge);
  background: var(--bg2); display: flex; flex-direction: column; height: 100vh;
}

/* ---------- side bars / trackers ---------- */
.side-bar {
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline;
  border: 1px solid var(--edge); border-left: 3px solid var(--fc, var(--edge));
  background: var(--panel); border-radius: 4px; padding: 6px 12px;
}
.id-name { color: var(--fc, var(--text)); font-weight: bold; cursor: pointer; }
.stat { color: var(--text); white-space: nowrap; }
.stat-bad { color: var(--danger); }

/* ---------- servers ---------- */
.servers-row { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.server {
  border: 1px dashed var(--edge); border-radius: 6px; padding: 6px;
  min-width: 118px; background: rgba(255,255,255,.015);
}
.server-name { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.server-content { display: flex; flex-direction: column; gap: 4px; margin-bottom: 6px; }
.server-ice { display: flex; flex-direction: column; gap: 3px; border-top: 1px dotted var(--edge); padding-top: 5px; }
.pile {
  border: 1px solid var(--edge); border-radius: 4px; text-align: center;
  padding: 8px 0; color: var(--dim); background: var(--bg2);
}
.empty-slot { border: 1px dotted var(--edge); border-radius: 4px; height: 34px; opacity: .5; }

/* ---------- card tiles ---------- */
.tile {
  border: 1px solid var(--edge); border-left: 3px solid var(--fc, var(--edge));
  border-radius: 4px; background: var(--bg2); padding: 4px 6px;
  cursor: pointer; position: relative; min-width: 104px;
}
.tile:hover { border-color: var(--accent); }
.tile-title { font-size: 12px; }
.tile-stats { font-size: 10px; color: var(--dim); }
.tile-ice { background: #101623; }
.tile-unrezzed, .tile-facedown { opacity: .8; }
.tile-facedown .tile-title, .tile-unrezzed .tile-title { color: var(--dim); letter-spacing: .2em; }
.tile-back {
  min-width: 46px; height: 30px; background: repeating-linear-gradient(
    135deg, #1a2233 0 6px, #141b29 6px 12px);
}
.tile-badges { position: absolute; top: -7px; right: -5px; display: flex; gap: 2px; }
.badge {
  font-size: 10px; border-radius: 8px; padding: 0 5px; border: 1px solid var(--edge);
  background: var(--panel); color: var(--text);
}
.b-adv { color: var(--gold); border-color: var(--gold); }
.b-virus { color: var(--good); border-color: var(--good); }
.b-credit { color: var(--accent); border-color: var(--accent); }
.b-agenda { color: var(--gold); border-color: var(--gold); }
.b-power { color: var(--accent2); border-color: var(--accent2); }
.b-str { color: var(--accent2); }

/* legal-action highlighting */
.actionable { outline: 1px solid var(--accent); box-shadow: 0 0 10px rgba(53,224,200,.35); }
.server.actionable { border-style: solid; }

/* ---------- rig / hands ---------- */
.rig-row { display: flex; gap: 10px; flex-wrap: wrap; }
.rig-col { border: 1px dashed var(--edge); border-radius: 6px; padding: 6px; min-width: 130px; flex: 1; }
.rig-label { color: var(--dim); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
.rig-cards { display: flex; flex-wrap: wrap; gap: 4px; }
.hand-row { display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; }
.hand-label { color: var(--dim); font-size: 11px; letter-spacing: .1em; white-space: nowrap; padding-top: 8px; }
.hand-cards { display: flex; flex-wrap: wrap; gap: 4px; }

/* ---------- run banner ---------- */
.run-banner {
  border: 1px solid var(--accent2); color: var(--accent2);
  border-radius: 4px; padding: 5px 12px; letter-spacing: .1em;
  background: rgba(255,77,157,.07); box-shadow: 0 0 14px rgba(255,77,157,.25);
}

/* ---------- sidebar: prompt / inspector / log ---------- */
.watch-controls { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--edge); }
.prompt {
  padding: 10px; border-bottom: 1px solid var(--edge);
  display: flex; flex-direction: column; gap: 5px; max-height: 44vh; overflow: auto;
}
.prompt-side { color: var(--accent2); font-size: 10px; letter-spacing: .2em; }
.prompt-head { color: var(--accent); }
.prompt-sub { color: var(--dim); }
.opt-btn { width: 100%; }
.num-row { display: flex; gap: 6px; }
.num-input { width: 90px; background: var(--bg); color: var(--text); border: 1px solid var(--edge); border-radius: 4px; padding: 4px 8px; }

.inspector { border-bottom: 1px solid var(--edge); max-height: 34vh; overflow: auto; }
.inspector-head {
  position: sticky; top: 0; background: var(--bg2);
  color: var(--accent); font-size: 10px; letter-spacing: .25em;
  padding: 6px 12px 4px; border-bottom: 1px dotted var(--edge);
}
.inspector-empty { color: var(--dim); font-size: 12px; padding: 10px 12px; }
.inspector-flash { animation: insp-glow 1.1s ease-out; }
@keyframes insp-glow {
  0%   { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 26px rgba(53,224,200,.35);
         background: rgba(53,224,200,.10); }
  100% { box-shadow: none; background: transparent; }
}
.card-full { padding: 10px 12px; border-left: 3px solid var(--fc, var(--edge)); }
.cf-title { color: var(--fc, var(--text)); font-weight: bold; }
.cf-typeline { color: var(--dim); font-size: 12px; margin: 2px 0 6px; text-transform: capitalize; }
.cf-faction { float: right; color: var(--fc, var(--dim)); }
.cf-stats { color: var(--gold); font-size: 12px; margin-bottom: 6px; }
.cf-text { font-size: 13px; }
.cf-flavor { color: var(--dim); font-style: italic; font-size: 12px; margin-top: 8px; }

.log { flex: 1; overflow-y: auto; padding: 8px 10px; font-size: 12px; }
.log-line { padding: 1px 0; color: var(--dim); }
.log-turn { color: var(--accent); margin-top: 6px; }
.log-run { color: var(--accent2); }
.log-good { color: var(--good); }
.log-bad { color: var(--danger); }
.log-score { color: var(--gold); font-weight: bold; }
.log-over { color: var(--gold); font-weight: bold; letter-spacing: .1em; }
.log-unknown { color: #555; }

/* ---------- popover ---------- */
.popover {
  position: fixed; z-index: 50; background: var(--panel);
  border: 1px solid var(--accent); border-radius: 6px; padding: 6px;
  display: flex; flex-direction: column; gap: 4px; max-width: 270px;
  box-shadow: 0 6px 24px rgba(0,0,0,.6);
}

/* ---------- symbols ---------- */
.sym { white-space: nowrap; }
.sym i { font-style: normal; font-size: 9px; vertical-align: super; }
.sym-credit { color: var(--accent); }
.sym-click { color: var(--gold); }
.sym-sub { color: var(--accent2); }
.sym-trash { color: var(--danger); }
.sym-mu { color: var(--good); }
.sym-link { color: var(--accent); }

</style>
</head>

<div id="setup" class="setup">
  <h1>NETRUNNER</h1>
  <div class="setup-sub">Revised Core Set &middot; vs computer</div>
  <div class="setup-grid">
    <fieldset class="setup-block setup-wide">
      <legend>Play as</legend>
      <div class="radio-row">

        <label><input type="radio" name="side" value="watch"> Watch AI vs AI</label>
      </div>
    </fieldset>
    <fieldset class="setup-block">
      <legend id="lbl-corp-deck">Corp deck</legend>
      <select id="sel-corp-deck"></select>
    </fieldset>
    <fieldset class="setup-block">
      <legend id="lbl-runner-deck">Runner deck</legend>
      <select id="sel-runner-deck"></select>
    </fieldset>
    <fieldset class="setup-block">
      <legend>AI difficulty</legend>
      <select id="sel-level">
        <option value="standard" selected>Standard</option>
        <option value="hard">Hard</option>
      </select>
    </fieldset>
    <fieldset class="setup-block">
      <legend>Seed (blank = random)</legend>
      <input id="inp-seed" type="text" placeholder="random">
    </fieldset>
  </div>
  <div id="deck-desc" class="deck-desc"></div>
  <button id="btn-start" class="btn btn-primary btn-big">Jack in</button>
</div>

<div id="table" style="display:none">
  <div class="layout">
    <div class="board">
      <div id="corp-zone"></div>
      <div id="mid-zone"></div>
      <div id="runner-zone"></div>
    </div>
    <div class="sidebar">
      <div id="watch-controls" style="display:none" class="watch-controls">
        <button id="btn-step1" class="btn">Step</button>
        <button id="btn-step25" class="btn">Step 25</button>
        <button id="btn-stepturn" class="btn">Next turn</button>
      </div>
      <div id="prompt" class="prompt"></div>
      <div id="inspector" class="inspector"></div>
      <div id="log" class="log"></div>
    </div>
  </div>
</div>
